<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bóveda de enlaces</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--bd:#dedcd5;--ac:#2f5fd0;--ac-tx:#fff;--dg:#c0392b;--wn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#eeede8;--mu:#a09f98;--bd:#3a3a36;--ac:#6d93f0;--ac-tx:#101010;--dg:#ee7b6e;--wn:#e0b050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#eeede8;--mu:#a09f98;--bd:#3a3a36;--ac:#6d93f0;--ac-tx:#101010;--dg:#ee7b6e;--wn:#e0b050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.35rem;margin:0}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
input[type=checkbox]{width:auto}
button{padding:8px 13px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer}
button.p,button.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
button.d{color:var(--dg)}
.gate{max-width:360px;margin:18vh auto 0;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;display:grid;gap:12px}
.gate p,.mu{margin:0;color:var(--mu);font-size:.9rem}
.err{color:var(--dg);font-size:.9rem;min-height:1.2em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:5px 10px;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:8px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bar{display:grid;grid-template-columns:1fr 140px;gap:8px;margin-bottom:6px}
h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 0 8px;cursor:pointer;user-select:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.head{display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.item a{color:var(--ac);word-break:break-all;font-size:.85rem}
.tag{font-size:.72rem;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--mu);margin-right:4px;display:inline-block}
.tag.w{color:var(--wn);border-color:var(--wn)}
.note{font-size:.88rem;color:var(--mu);margin:0}
iframe{width:100%;height:340px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.hide{display:none!important}
.empty{color:var(--mu);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
 <div id="gate" class="gate">
  <h1>🔒 Bóveda</h1>
  <p id="gmsg"></p>
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="off">
  <input id="pw2" type="password" placeholder="Repite la contraseña" class="hide" autocomplete="off">
  <div class="err" id="gerr"></div>
  <button class="p" id="go">Entrar</button>
 </div>

 <div id="app" class="hide">
  <div class="top"><h1>Mis frames y enlaces</h1>
   <div class="acts"><button id="th">Tema</button><button id="vw">Lista</button><button id="st">Ajustes</button><button id="lock">Bloquear</button></div></div>

  <div id="settings" class="panel hide">
   <strong>Cambiar contraseña</strong>
   <div class="row"><input id="np" type="password" placeholder="Nueva contraseña"><input id="np2" type="password" placeholder="Repetir"></div>
   <button id="cp">Cambiar</button>
   <strong>Copia cifrada</strong>
   <p class="mu">Copia el texto para guardarlo. Para restaurar, pégalo y escribe la contraseña con la que se creó.</p>
   <textarea id="bk" rows="3" placeholder="Texto de la copia"></textarea>
   <input id="ipw" type="password" placeholder="Contraseña de la copia (solo para importar)">
   <div class="acts"><button id="ex">Generar copia</button><button id="im">Importar</button></div>
   <div class="mu" id="smsg"></div>
  </div>

  <div id="formbox" class="panel">
   <input id="t" placeholder="Título">
   <textarea id="u" rows="2" placeholder="URL o código &lt;iframe …&gt;"></textarea>
   <div class="row"><input id="c" placeholder="Categoría" list="cats"><select id="k"><option value="enlace">Enlace</option><option value="frame">Frame</option></select></div>
   <input id="tg" placeholder="Etiquetas, separadas por comas">
   <input id="nt" placeholder="Nota corta (opcional)">
   <label class="mu"><input type="checkbox" id="sh"> Mostrar en el Escaparate</label>
   <datalist id="cats"></datalist>
   <div class="mu" id="amsg"></div>
   <button class="p" id="add">Guardar</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="bar" id="bar"><input id="q" placeholder="Buscar por título, URL, etiqueta o nota…"><select id="f"><option value="">Todos</option><option value="enlace">Enlaces</option><option value="frame">Frames</option></select></div>
  <div id="list"></div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}}};
let key=null,salt=null,items=[],editId=null,tab='all',pres=false,collapsed=new Set(),armed=null;
let pref=JSON.parse(ls.get('pref')||'{"view":"grid","theme":""}');
const sp=()=>ls.set('pref',JSON.stringify(pref));
function applyPref(){if(pref.theme)document.documentElement.dataset.theme=pref.theme;else delete document.documentElement.dataset.theme;$('#vw').textContent=pref.view==='grid'?'Lista':'Cuadrícula'}
applyPref();
const vault=()=>{try{return JSON.parse(ls.get('vault')||'null')}catch(e){return null}};
async function derive(pw,s){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function save(){const iv=crypto.getRandomValues(new Uint8Array(12));
 const d=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(items)));
 if(!ls.set('vault',JSON.stringify({s:b64(salt),iv:b64(iv),d:b64(d)})))alert('No se pudo guardar en este navegador.')}
const v=vault();
$('#gmsg').textContent=v?'Introduce tu contraseña para abrir la bóveda.':'Primera vez: crea una contraseña. Cifrará todo lo que guardes. Si la olvidas, no se puede recuperar.';
if(!v){$('#pw2').classList.remove('hide');$('#go').textContent='Crear bóveda'}

async function enter(){
 const pw=$('#pw').value,ge=$('#gerr');ge.textContent='';if(!pw)return;
 const fl=JSON.parse(ls.get('fails')||'{"n":0,"u":0}');
 if(Date.now()<fl.u){ge.textContent='Demasiados intentos. Espera '+Math.ceil((fl.u-Date.now())/1000)+' s.';return}
 try{
  if(v){const s=ub(v.s),k=await derive(pw,s);
   const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(v.iv)},k,ub(v.d));
   key=k;salt=s;items=JSON.parse(dec.decode(p));
  }else{
   if(pw.length<6){ge.textContent='Mínimo 6 caracteres.';return}
   if(pw!==$('#pw2').value){ge.textContent='Las contraseñas no coinciden.';return}
   salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pw,salt);items=[];await save();
  }
  ls.set('fails','{"n":0,"u":0}');
  $('#gate').classList.add('hide');$('#app').classList.remove('hide');idle();render();
 }catch(e){
  fl.n++;if(fl.n>=3)fl.u=Date.now()+Math.min(30*2**(fl.n-3),600)*1000;ls.set('fails',JSON.stringify(fl));
  ge.textContent='Contraseña incorrecta.'+(fl.n>=3?' Espera antes de reintentar.':'');
 }
}
$('#go').onclick=enter;
['#pw','#pw2'].forEach(s=>$(s).onkeydown=e=>{if(e.key==='Enter')enter()});
$('#lock').onclick=()=>location.reload();
let tm;function idle(){const r=()=>{clearTimeout(tm);tm=setTimeout(()=>location.reload(),300000)};['click','keydown','touchstart','mousemove'].forEach(e=>addEventListener(e,r));r()}

$('#th').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;pref.theme=dark?'light':'dark';sp();applyPref()};
$('#vw').onclick=()=>{pref.view=pref.view==='grid'?'list':'grid';sp();applyPref();render()};
$('#st').onclick=()=>$('#settings').classList.toggle('hide');

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=raw=>{const m=raw.match(/src\s*=\s*["']([^"']+)["']/i);return(m?m[1]:raw).trim()};
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;

$('#add').onclick=async()=>{
 const raw=$('#u').value,url=clean(raw);if(!url)return;
 const old=items.find(x=>x.id===editId)||{};
 const it={...old,id:editId||Date.now().toString(36),t:$('#t').value.trim()||url,u:url,c:$('#c').value.trim()||'Sin categoría',
  k:/<iframe/i.test(raw)?'frame':$('#k').value,tags:$('#tg').value.split(',').map(s=>s.trim()).filter(Boolean),note:$('#nt').value.trim(),
  show:$('#sh').checked,fav:old.fav||false,del:false,date:old.date||new Date().toISOString().slice(0,10)};
 items=editId?items.map(x=>x.id===editId?it:x):[it,...items];
 $('#amsg').textContent=/^http:\/\//i.test(url)?'Aviso: este enlace no usa https.':'';
 editId=null;$('#add').textContent='Guardar';['#t','#u','#c','#tg','#nt'].forEach(s=>$(s).value='');$('#sh').checked=false;
 await save();render();
};

const TABS=[['all','Todo'],['fav','⭐ Favoritos'],['show','👁 Escaparate'],['trash','🗑 Papelera']];
function card(i){
 const h=hue(i.c),a=pres?'':`<div class="acts">
  <button data-a="f" data-id="${i.id}">${i.fav?'⭐':'☆'}</button>
  ${i.del?`<button data-a="r" data-id="${i.id}">Restaurar</button><button class="d" data-a="z" data-id="${i.id}">${armed===i.id?'¿Seguro?':'Borrar ya'}</button>`:
  `<button data-a="s" data-id="${i.id}">${i.show?'Visible':'Privado'}</button>${i.k==='frame'?`<button data-a="v" data-id="${i.id}">Ver frame</button>`:''}<button data-a="e" data-id="${i.id}">Editar</button><button class="d" data-a="x" data-id="${i.id}">Papelera</button>`}</div>`;
 return `<div class="item" id="i${i.id}"><div class="head"><div class="av" style="background:hsl(${h} 55% 45%)">${esc((i.t[0]||'?').toUpperCase())}</div>
 <div style="min-width:0"><strong>${esc(i.t)}</strong><div><span class="tag">${i.k}</span>${(i.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}${/^http:\/\//i.test(i.u)?'<span class="tag w">sin https</span>':''}</div></div></div>
 <a href="${esc(i.u)}" target="_blank" rel="noopener noreferrer">${esc(i.u)}</a>${i.note?`<p class="note">${esc(i.note)}</p>`:''}${a}</div>`;
}
function render(){
 $('#tabs').innerHTML=pres?'<button class="on" id="xp">Salir de la presentación</button>':TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')+(tab==='show'?'<button id="pp">Modo presentación</button>':'');
 $('#formbox').classList.toggle('hide',pres);$('#bar').classList.toggle('hide',pres);
 const q=$('#q').value.toLowerCase(),f=$('#f').value;
 $('#cats').innerHTML=[...new Set(items.map(i=>i.c))].map(c=>`<option value="${esc(c)}">`).join('');
 const ok=i=>tab==='trash'?i.del:!i.del&&(tab!=='fav'||i.fav)&&(tab!=='show'||i.show);
 const sel=items.filter(i=>ok(i)&&(!f||i.k===f)&&(i.t+i.u+i.c+(i.note||'')+(i.tags||[]).join(' ')).toLowerCase().includes(q));
 if(!sel.length){$('#list').innerHTML='<div class="empty">'+(tab==='show'?'Marca elementos como «Visible» para verlos aquí.':'Nada por aquí todavía.')+'</div>';return}
 const g={};sel.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)).forEach(i=>(g[i.c]=g[i.c]||[]).push(i));
 $('#list').innerHTML=Object.keys(g).sort().map(c=>`<h2 data-cat="${esc(c)}">${collapsed.has(c)?'▸':'▾'} ${esc(c)} (${g[c].length})</h2>`+
  (collapsed.has(c)?'':`<div class="${pref.view==='grid'?'grid':''}" ${pref.view==='grid'?'':'style="display:grid;gap:8px"'}>${g[c].map(card).join('')}</div>`)).join('');
}
$('#q').oninput=render;$('#f').onchange=render;
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.id==='pp'){pres=true;render()}if(b.id==='xp'){pres=false;render()}};
$('#list').onclick=async e=>{
 const h=e.target.closest('h2');if(h){const c=h.dataset.cat;collapsed.has(c)?collapsed.delete(c):collapsed.add(c);return render()}
 const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,it=items.find(x=>x.id===id),a=b.dataset.a;
 if(a==='v'){const box=$('#i'+id),ex=box.querySelector('iframe');
  if(ex){ex.remove();b.textContent='Ver frame'}else{const fr=document.createElement('iframe');fr.src=it.u;fr.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-forms');box.appendChild(fr);b.textContent='Ocultar'}return}
 if(a==='e'){editId=id;$('#t').value=it.t;$('#u').value=it.u;$('#c').value=it.c;$('#k').value=it.k;$('#tg').value=(it.tags||[]).join(', ');$('#nt').value=it.note||'';$('#sh').checked=!!it.show;$('#add').textContent='Actualizar';scrollTo(0,0);return}
 if(a==='z'){if(armed!==id){armed=id;return render()}armed=null;items=items.filter(x=>x.id!==id)}
 if(a==='f')it.fav=!it.fav;if(a==='s')it.show=!it.show;if(a==='x')it.del=true;if(a==='r')it.del=false;
 await save();render();
};

$('#cp').onclick=async()=>{const p=$('#np').value;
 if(p.length<6)return $('#smsg').textContent='Mínimo 6 caracteres.';
 if(p!==$('#np2').value)return $('#smsg').textContent='No coinciden.';
 salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(p,salt);await save();$('#np').value=$('#np2').value='';$('#smsg').textContent='Contraseña cambiada.'};
$('#ex').onclick=()=>{$('#bk').value=ls.get('vault')||'';$('#smsg').textContent='Copia generada: ya está cifrada.'};
$('#im').onclick=async()=>{try{const o=JSON.parse($('#bk').value),k=await derive($('#ipw').value,ub(o.s));
 const arr=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.d))));
 const ids=new Set(items.map(x=>x.id));items=[...items,...arr.filter(x=>!ids.has(x.id))];await save();render();$('#smsg').textContent='Importados '+arr.length+' elementos.'}
 catch(e){$('#smsg').textContent='No se pudo importar: revisa el texto y la contraseña.'}};
</script>
</body>
</html>
